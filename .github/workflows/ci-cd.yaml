name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ================================================================
  # Stage 1: Parallel Unit Tests
  # ================================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run Backend Unit Tests
        working-directory: backend
        run: uv run pytest tests/ -v

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ================================================================
  # Stage 2: Docker Compose Stack Integration & Playwright E2E Tests
  # ================================================================
  integration-and-e2e-tests:
    name: Docker Compose Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build and Start Docker Compose Stack
        run: docker compose up -d --build

      - name: Wait for Stack Readiness (/api/health)
        run: |
          echo "Waiting for Docker Compose services to become healthy..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:8000/api/health || true)
            if [ "$STATUS" -eq 200 ]; then
              if grep -q '"status":"ok"' /tmp/health.json && grep -q '"database":"postgresql"' /tmp/health.json; then
                echo "Stack is fully healthy and connected to PostgreSQL!"
                cat /tmp/health.json
                echo ""
                exit 0
              fi
            fi
            echo "Waiting for stack (attempt $i/60, HTTP status: $STATUS)..."
            sleep 2
          done
          echo "Stack failed to become ready in 120 seconds!"
          docker compose logs
          exit 1

      - name: Run Backend Integration Tests Against Live Stack
        run: |
          uv run --project backend pytest \
            backend/tests/test_compose_integration.py \
            backend/tests/test_postgres_live.py \
            backend/tests/test_two_session_live.py -v

      - name: Run Playwright E2E Tests
        working-directory: e2e
        run: npm test

      - name: Tear Down Docker Compose Stack
        if: always()
        run: docker compose down -v

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ================================================================
  # Stage 3: Deploy to Render & Validate Health Endpoint
  # ================================================================
  deploy:
    name: Deploy to Render & Validate Health
    runs-on: ubuntu-latest
    needs: [integration-and-e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment via Deploy Hook..."
            HTTP_CODE=$(curl -s -o /tmp/deploy_hook_response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" || true)
            echo "Deploy Hook response (HTTP $HTTP_CODE):"
            cat /tmp/deploy_hook_response.txt
            echo ""
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Render deployment successfully triggered via Deploy Hook!"
            else
              echo "Warning: Deploy Hook returned HTTP $HTTP_CODE. Proceeding to health check..."
            fi
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering Render deployment via REST API..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            echo "API Response: $RESPONSE"
          else
            echo "Notice: Neither RENDER_DEPLOY_HOOK_URL nor RENDER_API_KEY/RENDER_SERVICE_ID configured."
            echo "Assuming Render native GitHub Auto-Deploy is enabled on push to main branch."
          fi

      - name: Validate Deployment via Health Endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || 'https://kanban-bro.onrender.com' }}
        run: |
          HEALTH_URL="${RENDER_APP_URL%/}/api/health"
          echo "Validating Render deployment at health endpoint: $HEALTH_URL"
          
          # Allow Render build/deploy container initialization buffer
          echo "Waiting 20 seconds for initial container deployment..."
          sleep 20

          MAX_RETRIES=36
          RETRY_INTERVAL=10

          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i/$MAX_RETRIES: Checking $HEALTH_URL..."
            HTTP_CODE=$(curl -s -o /tmp/render_health.json -w "%{http_code}" "$HEALTH_URL" || true)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Health check succeeded with HTTP 200 OK!"
              cat /tmp/render_health.json
              echo ""

              if grep -q '"status":"ok"' /tmp/render_health.json; then
                echo "SUCCESS: Render deployment verified! Application is healthy and operational."
                exit 0
              else
                echo "Warning: Health endpoint returned 200 but status was not 'ok'. Retrying..."
              fi
            else
              echo "Health check returned HTTP $HTTP_CODE (retrying in ${RETRY_INTERVAL}s)..."
            fi
            
            sleep $RETRY_INTERVAL
          done

          echo "ERROR: Render deployment health check timed out after $(($MAX_RETRIES * $RETRY_INTERVAL)) seconds."
          echo "Check Render service dashboard logs for deployment details."
          exit 1
