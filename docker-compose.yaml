services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdip
      POSTGRES_PASSWORD: sdip
      POSTGRES_DB: sdip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdip -d sdip"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kanban-bro-app:latest
    container_name: kanban-bro-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sdip:sdip@postgres:5432/sdip
      AUTO_SEED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
