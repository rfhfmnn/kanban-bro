services:
  db:
    image: postgres:16-alpine
    container_name: interview-canvas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdip
      POSTGRES_PASSWORD: sdip
      POSTGRES_DB: sdip
    ports:
      - "5432:5432"
    volumes:
      - interview-canvas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdip -d sdip"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban-bro
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sdip:sdip@db:5432/sdip
      AUTO_SEED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  interview-canvas-pgdata:
