databases:
  - name: kanban-postgres
    databaseName: sdip
    user: sdip
    plan: free
    region: oregon

services:
  - type: web
    name: kanban-bro
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-postgres
          property: connectionString
      - key: AUTO_SEED
        value: "true"
      - key: PORT
        value: "8000"
